server {
    listen 80;

    location / {
        proxy_pass         http://kanboard:80;
        # $http_host preserves the :8090 port so Kanboard redirect URLs are correct
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Remote-User     buurtgenoot;
        proxy_read_timeout 90s;
        # strip this header so the iframe is allowed to embed Kanboard
        proxy_hide_header  X-Frame-Options;
    }
}
