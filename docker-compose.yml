services:
  buurtbox:
    build: .
    ports:
      - "80:80"
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: "${RAILS_MASTER_KEY}"
      RAILS_LOG_LEVEL: info
    volumes:
      - buurtbox_storage:/rails/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve
    # override entrypoint so the shell expands the *.zim glob directly
    entrypoint: ["/bin/sh", "-c", "kiwix-serve --port 8080 /data/*.zim"]
    command: []
    ports:
      - "8080:8080"
    volumes:
      - "/home/larsbohm/kiwix-data:/data"
    restart: unless-stopped

  pairdrop:
    image: lscr.io/linuxserver/pairdrop:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Amsterdam
      RATE_LIMIT: "false"
      WS_FALLBACK: "true"
    ports:
      - "3001:3000"
    restart: unless-stopped

  kanboard:
    image: kanboard/kanboard:latest
    # no port exposed — only reachable via kanboard-proxy
    environment:
      REVERSE_PROXY_AUTH: "true"
      REVERSE_PROXY_USER_HEADER: "HTTP_X_REMOTE_USER"
      REVERSE_PROXY_DEFAULT_ADMIN: "buurtgenoot"
    volumes:
      - kanboard_data:/var/www/app/data
      - kanboard_plugins:/var/www/app/plugins
    restart: unless-stopped

  # nginx injects X-Remote-User so Kanboard auto-logs everyone in — no login form shown
  kanboard-proxy:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./config/kanboard-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kanboard
    restart: unless-stopped

volumes:
  buurtbox_storage:
  kanboard_data:
  kanboard_plugins:
